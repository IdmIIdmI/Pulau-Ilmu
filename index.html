
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Magical Jurassic Kingdom V3</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#10152c;font-family:Arial,sans-serif;color:white}
#game{width:100vw;height:100vh;display:block}
#top{
 position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;gap:8px;pointer-events:none
}
.panel{background:#171b36dd;border:1px solid #ffffff40;border-radius:12px;padding:9px 12px;font-size:13px}
#message{
 position:absolute;top:70px;left:50%;transform:translateX(-50%);
 background:#211b43ee;border:1px solid #e7caff;border-radius:14px;
 padding:12px 18px;text-align:center;max-width:85%;font-size:14px;
 display:none
}
#controls{position:absolute;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:50px 50px;gap:5px}
button{
 border:1px solid #ffffff70;border-radius:13px;background:#342c68dd;
 color:white;font-weight:bold;font-size:13px;padding:10px;touch-action:none
}
button:active{background:#9364d9}
.pad button{font-size:22px;padding:0}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actions{display:grid;grid-template-columns:repeat(2,auto);gap:7px}
.actions button{min-width:75px;min-height:43px}
#costumes{position:absolute;top:66px;right:10px;display:flex;gap:5px}
#costumes button{font-size:11px;padding:8px}
#hint{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;background:#171b36bb;padding:7px 10px;border-radius:10px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
 <div class="panel">💎 Kristal: <span id="crystals">0</span>/10<br>🥚 Telur: <span id="eggs">0</span>/5</div>
 <div class="panel">❤️ Bos: <span id="bossHP">100</span>%<br>🐉 <span id="mode">Berjalan</span></div>
</div>

<div id="message"></div>

<div id="costumes">
 <button onclick="changeCostume(0)">🧙 Sihir</button>
 <button onclick="changeCostume(1)">🛡️ Kesatria</button>
 <button onclick="changeCostume(2)">👑 Diraja</button>
</div>

<div id="hint">Cari kristal, telur dan istana ajaib!</div>

<div id="controls">
 <div class="pad">
  <button id="up">▲</button>
  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
 </div>
 <div class="actions">
  <button id="jump">⬆ LOMPAT</button>
  <button id="magic">✨ SIHIR</button>
  <button id="ride">🐉 NAIK NAGA</button>
  <button id="interact">🏰 GUNA</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,clock;
let player,dragon,boss,castle,door;
let crystals=[],eggs=[],spells=[];
let keys={},jumping=false,velocityY=0;
let riding=false,crystalCount=0,eggCount=0,bossHealth=100;
let costume=0,castleInside=false;
let messageTimer;

const $=id=>document.getElementById(id);
function say(t){
 const m=$("message");m.textContent=t;m.style.display="block";
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>m.style.display="none",3500);
}
function mat(c,rough=.8){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
function box(parent,x,y,z,w,h,d,color){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 o.position.set(x,y,z);parent.add(o);return o;
}
function sphere(parent,x,y,z,r,color){
 const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(color));
 o.position.set(x,y,z);parent.add(o);return o;
}
function cylinder(parent,x,y,z,rt,rb,h,color){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,12),mat(color));
 o.position.set(x,y,z);parent.add(o);return o;
}
function makeDino(){
 const g=new THREE.Group();
 const green=mat(0x63d69b), belly=mat(0xffd68a), dark=mat(0x287e69);
 sphere(g,0,1.15,0,.65,0x63d69b);
 sphere(g,0,1.85,.18,.55,0x73e5b0);
 sphere(g,-.22,1.95,.62,.10,0xffffff);
 sphere(g,.22,1.95,.62,.10,0xffffff);
 sphere(g,-.22,1.95,.71,.045,0x17152a);
 sphere(g,.22,1.95,.71,.045,0x17152a);
 sphere(g,0,1.65,.68,.13,0xffa0a0);
 sphere(g,0,1.1,.58,.39,0xffd68a);
 const tail=sphere(g,0,1,-.85,.22,0x287e69);tail.scale.set(.7,.7,2.2);
 for(let x of [-.35,.35]){
  box(g,x,.48,0,.25,.75,.28,0x48b982);
 }
 const robe=cylinder(g,0,1.1,0,.57,.75,.85,0x7549c7);
 robe.material=mat(0x7549c7);
 const hat=new THREE.Group();g.add(hat);
 cylinder(hat,0,2.48,.12,.02,.35,.65,0x6037a8);
 cylinder(hat,0,2.15,.12,.43,.43,.12,0x3e247e);
 sphere(hat,.2,2.25,.18,.08,0xffe36b);
 const staff=box(g,.85,1.1,.25,.08,1.5,.08,0x8b542c);
 sphere(g,.85,1.9,.25,.19,0x8b5cff);
 g.userData={robe,hat,staff};
 return g;
}
function makeDragon(){
 const g=new THREE.Group();
 sphere(g,0,0,0,.75,0x9d70ff);
 sphere(g,0,.1,.65,.4,0xb58bff);
 sphere(g,-.17,.2,.96,.09,0xffffff);
 sphere(g,.17,.2,.96,.09,0xffffff);
 sphere(g,-.17,.2,1.03,.04,0x17152a);
 sphere(g,.17,.2,1.03,.04,0x17152a);
 const tail=sphere(g,0,-.1,-1,.18,0x8052d8);tail.scale.set(.7,.7,2);
 const wings=[];
 for(let s of [-1,1]){
  const w=box(g,s*.75,.25,-.1,.9,.08,.75,0x7145c9);
  w.rotation.z=s*.5;wings.push(w);
 }
 g.userData={wings};
 return g;
}
function tree(x,z){
 const g=new THREE.Group();
 cylinder(g,0,1,0,.2,.3,2,0x75472d);
 sphere(g,0,2.3,0,1.05,0x2a9b6b);
 sphere(g,.6,2.5,.1,.65,0x42c887);
 g.position.set(x,0,z);scene.add(g);
}
function makeCrystal(x,z){
 const g=new THREE.Group();
 const c=new THREE.Mesh(new THREE.OctahedronGeometry(.55),mat(0x55f4ff,.25));
 c.position.y=1;g.add(c);
 const glow=new THREE.PointLight(0x44eaff,1.5,5);glow.position.y=1;g.add(glow);
 g.position.set(x,0,z);scene.add(g);crystals.push(g);
}
function makeEgg(x,z){
 const g=new THREE.Group();
 const e=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),mat(0xffd34f));
 e.scale.y=1.25;e.position.y=.45;g.add(e);
 sphere(g,0,.5,.32,.09,0xff704d);
 g.position.set(x,0,z);scene.add(g);eggs.push(g);
}
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x8bdcff);
 scene.fog=new THREE.Fog(0x8bdcff,35,100);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
 renderer=new THREE.WebGLRenderer({canvas:$("game"),antialias:true});
 renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;
 clock=new THREE.Clock();
 scene.add(new THREE.HemisphereLight(0xffffff,0x49734b,2));
 const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(15,25,10);scene.add(sun);

 const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),mat(0x4fbd79));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
 // Laluan batu
 for(let i=0;i<18;i++)box(scene,0,.01,12-i*2.3,2.8,.12,1.7,0xb7a58b);
 // Pokok dan cendawan
 for(let i=0;i<42;i++){
  let x=(Math.random()-.5)*65,z=(Math.random()-.5)*65;
  if(Math.abs(x)<5&&z> -25&&z<15)continue;
  tree(x,z);
 }
 for(let i=0;i<12;i++){
  const x=(Math.random()-.5)*35,z=(Math.random()-.5)*35;
  cylinder(scene,x,.35,z,.18,.25,.7,0xff6b9d);
  sphere(scene,x,.75,z,.4,0xffa5c8);
 }
 // Gunung dan gunung berapi
 const volcano=new THREE.Mesh(new THREE.ConeGeometry(8,13,8),mat(0x66505b));
 volcano.position.set(-23,6,-28);scene.add(volcano);
 const lava=sphere(scene,-23,11.5,-28,1.4,0xff632e);
 // Istana
 castle=new THREE.Group();castle.position.set(0,0,-32);scene.add(castle);
 box(castle,0,3,0,12,6,7,0xeadcfb);
 box(castle,0,1,3.56,2.2,2.8,.2,0x39234f);
 door=new THREE.Group();door.position.set(0,0,3.8);castle.add(door);
 box(door,0,1.3,0,1.8,2.6,.2,0x8e54bd);
 for(let x of [-5,5]){
  box(castle,x,5,0,2,10,2,0x9d76d6);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.7,3,4),mat(0x633ba1));
  roof.position.set(x,11,0);castle.add(roof);
 }
 const roof=new THREE.Mesh(new THREE.ConeGeometry(7,4,4),mat(0x7549b7));
 roof.position.set(0,8,0);castle.add(roof);
 // Kristal
 [[-8,0],[8,1],[-12,-12],[12,-15],[-18,12],[18,10],[-5,-22],[7,-25],[22,-5],[-22,-8]]
 .forEach(p=>makeCrystal(p[0],p[1]));
 [[-5,8],[5,12],[-14,-18],[14,-22],[0,-42]].forEach(p=>makeEgg(p[0],p[1]));

 player=makeDino();player.position.set(0,0,12);scene.add(player);
 dragon=makeDragon();scene.add(dragon);dragon.visible=false;

 // Bos dinosaur gelap
 boss=new THREE.Group();
 sphere(boss,0,1.2,0,1.1,0x4b294f);
 sphere(boss,0,2,.2,.8,0x63335f);
 for(let x of [-.3,.3])sphere(boss,x,2.1,.85,.13,0xff3030);
 const horns=[];
 for(let x of [-.55,.55]){
  const h=new THREE.Mesh(new THREE.ConeGeometry(.22,.9,8),mat(0xe9c7ff));
  h.position.set(x,2.8,.1);boss.add(h);
 }
 boss.position.set(15,0,-18);scene.add(boss);

 say("Selamat datang, wira kecil! Kumpulkan 10 kristal dan selamatkan kerajaan!");
 animate();
}
function changeCostume(n){
 costume=n;
 const r=player.userData.robe;
 const h=player.userData.hat;
 if(n===0){r.material=mat(0x7549c7);h.visible=true;player.userData.staff.visible=true;say("Kostum Ahli Sihir dipakai! ✨")}
 if(n===1){r.material=mat(0x9c9caa);h.visible=false;player.userData.staff.visible=false;say("Kostum Kesatria dipakai! 🛡️")}
 if(n===2){r.material=mat(0xe2b83e);h.visible=false;player.userData.staff.visible=true;say("Kostum Diraja dipakai! 👑")}
}
function castSpell(){
 const p=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),mat(0x9d6bff));
 p.position.copy(player.position);p.position.y+=1.5;
 const dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
 p.userData.dir=dir;spells.push(p);scene.add(p);
}
function toggleRide(){
 riding=!riding;dragon.visible=riding;player.visible=!riding;
 $("mode").textContent=riding?"Menunggang naga":"Berjalan";
 say(riding?"Naga ajaib sedia terbang! 🐉":"Kembali berjalan.");
}
function interact(){
 if(player.position.distanceTo(castle.position)<12){
  castleInside=!castleInside;
  if(castleInside){
   player.position.set(0,0,-28);
   say("Kamu memasuki istana! Puteri dinosaur: 'Tolong kalahkan naga gelap!'");
  }else{
   player.position.set(0,0,-20);
   say("Kamu keluar dari istana. Teruskan pengembaraan!");
  }
 }else if(player.position.distanceTo(boss.position)<5){
  say("Naga Gelap: 'Kamu tidak akan dapat kristal terakhir!' Serang dengan sihir!");
 }else{
  say("Cari istana di hadapan dan kumpulkan kristal ajaib!");
 }
}
function bindHold(id,key){
 const b=$(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});
 b.addEventListener("pointerup",()=>keys[key]=false);
 b.addEventListener("pointercancel",()=>keys[key]=false);
 b.addEventListener("lostpointercapture",()=>keys[key]=false);
}
bindHold("up","up");bindHold("down","down");bindHold("left","left");bindHold("right","right");
$("jump").addEventListener("pointerdown",()=>{if(!jumping){velocityY=riding?0.22:.22;jumping=true}});
$("magic").addEventListener("click",castSpell);
$("ride").addEventListener("click",toggleRide);
$("interact").addEventListener("click",interact);
addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key===" ")velocityY=.22;
 if(e.key==="e")interact();
 if(e.key==="f")castSpell();
});
addEventListener("keyup",e=>{
 if(["ArrowUp","w"].includes(e.key))keys.up=false;
 if(["ArrowDown","s"].includes(e.key))keys.down=false;
 if(["ArrowLeft","a"].includes(e.key))keys.left=false;
 if(["ArrowRight","d"].includes(e.key))keys.right=false;
});
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const speed=riding?13:7;
 let dx=0,dz=0;
 if(keys.up)dz-=1;if(keys.down)dz+=1;
 if(keys.left)dx-=1;if(keys.right)dx+=1;
 const len=Math.hypot(dx,dz)||1;dx/=len;dz/=len;
 if(dx||dz){
  player.position.x+=dx*speed*dt;
  player.position.z+=dz*speed*dt;
  player.rotation.y=Math.atan2(dx,dz)+Math.PI;
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-65,65);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-65,65);
 if(jumping){
  player.position.y+=velocityY;
  velocityY-=.012;
  if(player.position.y<=0){player.position.y=0;jumping=false;velocityY=0}
 }
 if(riding){
  dragon.position.set(player.position.x,player.position.y+1,player.position.z);
  dragon.rotation.y=player.rotation.y;
  dragon.userData.wings.forEach((w,i)=>w.rotation.z=(i===0?-1:1)*(.5+Math.sin(clock.elapsedTime*12)*.35));
  dragon.position.y+=Math.sin(clock.elapsedTime*4)*.12;
 }
 // Animasi dinosaur
 player.rotation.z=dx*.08;
 player.userData.robe.rotation.y=Math.sin(clock.elapsedTime*2)*.05;
 // Kamera ikut pemain
 const target=new THREE.Vector3(player.position.x+8,player.position.y+8,player.position.z+12);
 camera.position.lerp(target,.08);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z-3);
 // Kristal dikutip
 for(let i=crystals.length-1;i>=0;i--){
  const c=crystals[i];c.rotation.y+=dt*1.5;c.position.y= Math.sin(clock.elapsedTime*2+i)*.15;
  if(c.position.distanceTo(player.position)<1.8){
   scene.remove(c);crystals.splice(i,1);crystalCount++;
   $("crystals").textContent=crystalCount;
   say("Kristal ajaib diperoleh! 💎");
   if(crystalCount===10)say("HEBAT! Semua 10 kristal telah dikumpulkan!");
  }
 }
 for(let i=eggs.length-1;i>=0;i--){
  const e=eggs[i];e.rotation.y+=dt;
  if(e.position.distanceTo(player.position)<1.8){
   scene.remove(e);eggs.splice(i,1);eggCount++;
   $("eggs").textContent=eggCount;say("Telur dinosaur dijumpai! 🥚");
  }
 }
 // Sihir dan serangan bos
 for(let i=spells.length-1;i>=0;i--){
  const s=spells[i];s.position.addScaledVector(s.userData.dir,dt*22);
  if(s.position.distanceTo(boss.position)<2.5){
   scene.remove(s);spells.splice(i,1);
   bossHealth=Math.max(0,bossHealth-10);
   $("bossHP").textContent=bossHealth;
   boss.scale.multiplyScalar(.98);
   if(bossHealth===0){say("TAHNIAH! Naga Gelap telah dikalahkan! 🏆");boss.visible=false}
  }else if(s.position.distanceTo(player.position)>45){
   scene.remove(s);spells.splice(i,1);
  }
 }
 boss.rotation.y=Math.sin(clock.elapsedTime)*.4;
 if(boss.visible&&boss.position.distanceTo(player.position)<4){
  // Bos mengaum, tetapi tidak menolak pemain
 }
 renderer.render(scene,camera);
}
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
init();
</script>
</body>
</html>
