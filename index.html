
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ultimate Jurassic Kingdom V10</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#10251f;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
.panel{background:#102c26ed;color:white;padding:9px 11px;border:1px solid #ffffff55;border-radius:13px;font-size:12px}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
#zone{font-size:15px;font-weight:bold;color:#ffe58a}
#mission{margin-top:5px;line-height:1.3;max-width:225px}
#stats{text-align:right;min-width:112px}
#healthbar,#bossbar{height:7px;background:#555;border-radius:8px;overflow:hidden;margin-top:5px}
#healthfill{height:100%;width:100%;background:#62e36c}
#bossfill{height:100%;width:100%;background:#e64b43}
#heroes{position:fixed;top:82px;left:8px;display:flex;flex-direction:column;gap:5px}
button{border:1px solid #ffffff77;background:#183b35ed;color:white;border-radius:13px;font-weight:bold;min-width:45px;height:45px;font-size:16px;touch-action:none}
button:active{background:#b18a35}
.hero{height:36px;min-width:100px;text-align:left;padding-left:8px;font-size:12px}
.hero.active{border:2px solid #ffe36a;background:#526e38}
#bottom{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 10px;pointer-events:none}
#moves,#actions{display:flex;gap:5px;pointer-events:auto}
#actions{flex-direction:column}
#actions button{height:40px;font-size:11px;padding:0 8px}
#hint{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#102b27d9;color:white;padding:7px 11px;border-radius:12px;font-size:11px;white-space:nowrap}
#dialog{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,370px);padding:18px;background:#16382ff5;color:white;border:2px solid #ffda72;border-radius:17px;text-align:center;line-height:1.5}
#dialog button{height:40px;margin-top:10px;padding:0 20px}
#sound{position:fixed;right:10px;top:70px;height:34px;min-width:42px;font-size:12px}
#bossPanel{display:none;position:fixed;top:145px;left:50%;transform:translateX(-50%);width:min(65%,300px);text-align:center;color:white;font-size:12px;background:#351d1dd9;padding:7px;border-radius:10px}
#bossbar{margin-top:5px}
#bossfill{background:#fa4545}
@media(min-width:800px){#bottom{max-width:750px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>
<div id="top">
 <div class="panel">
  <div id="zone">KERAJAAN DINOSAUR</div>
  <div id="mission">Misi: Cari ketua kampung.</div>
 </div>
 <div class="panel" id="stats">
  ❤️ <span id="health">5</span> &nbsp; 💎 <span id="crystals">0</span>/8<br>
  🥚 <span id="eggs">0</span>/3 &nbsp; 🦖 <span id="rescued">0</span>/3
  <div id="healthbar"><div id="healthfill"></div></div>
  <div id="heroName">LALA</div>
 </div>
</div>

<div id="heroes">
 <button class="hero active" data-hero="0">🟢 LALA</button>
 <button class="hero" data-hero="1">🛡️ TORA</button>
 <button class="hero" data-hero="2">👑 RAJA REX</button>
 <button class="hero" data-hero="3">🔵 BOBI</button>
</div>
<button id="sound">🔊</button>

<div id="bossPanel">
 RAJA BAYANG
 <div id="bossbar"><div id="bossfill"></div></div>
 <div id="bossHealthText">Tenaga: 100%</div>
</div>

<div id="hint">Terokai dunia • Bantu kawan • Kumpulkan kristal</div>
<div id="bottom">
 <div id="moves">
  <button data-move="left">◀</button>
  <button data-move="forward">▲</button>
  <button data-move="back">▼</button>
  <button data-move="right">▶</button>
 </div>
 <div id="actions">
  <button id="jump">LOMPAT</button>
  <button id="power">KUASA WIRA</button>
  <button id="attack">SERANG</button>
  <button id="talk">INTERAKSI</button>
 </div>
</div>

<div id="dialog">
 <div id="dialogText"></div>
 <button id="closeDialog">JOM TERUSKAN!</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ================= DUNIA 3D ================= */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d9eb);
scene.fog=new THREE.Fog(0x91d9eb,100,235);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe8faff,0x52613b,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-45,85,45);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const green=mat(0x60b94b),darkGreen=mat(0x286b39);
const brown=mat(0x79502e),wood=mat(0x9b6838);
const stone=mat(0x777b79),gold=mat(0xffcf38);
const water=mat(0x35bce0,.25),leaf=mat(0x338247);
const white=mat(0xffffff),black=mat(0x172027);

function cube(p,x,y,z,sx,sy,sz,m){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o;
}
function ball(p,x,y,z,sx,sy,sz,m){
 const o=new THREE.Mesh(new THREE.SphereGeometry(1,12,9),m);
 o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;p.add(o);return o;
}
function cyl(p,x,y,z,r1,r2,h,m){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,9),m);
 o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;
}
function floor(x,z,w,d,c){
 const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(c));
 o.rotation.x=-Math.PI/2;o.position.set(x,-.08,z);o.receiveShadow=true;scene.add(o);
}
floor(0,0,280,280,0x75b75b);
floor(0,0,48,38,0x91c96c);
floor(-48,-28,55,55,0x397a42);
floor(-65,35,55,48,0x83b977);
floor(52,-38,55,55,0x986044);
floor(55,45,55,50,0xc9e6ee);
floor(0,0,5,95,0xb9a27c);
floor(-25,-20,50,4,0xb9a27c);
floor(-50,8,4,60,0xb9a27c);
floor(25,-20,55,4,0xb9a27c);
floor(48,10,4,55,0xb9a27c);

/* ================= KAMPUNG ================= */
function tree(x,z,s=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
 cyl(g,0,1.1,0,.25,.35,2.2,brown);
 ball(g,0,2.4,0,1.15,1.4,1.1,leaf);
 ball(g,-.55,2.1,.1,.8,.9,.8,darkGreen);
 ball(g,.55,2.1,-.1,.8,.9,.8,green);
 scene.add(g);
}
for(let i=0;i<42;i++){
 const a=Math.random()*6.28,r=28+Math.random()*30;
 tree(-48+Math.cos(a)*r,-28+Math.sin(a)*r,.7+Math.random()*.6);
}
for(let i=0;i<25;i++)tree(52+(Math.random()-.5)*48,-38+(Math.random()-.5)*48,.7+Math.random()*.6);

function house(x,z,c){
 const g=new THREE.Group();g.position.set(x,0,z);
 cube(g,0,1.1,0,4,2.2,3.5,mat(c));
 const roof=new THREE.Mesh(new THREE.ConeGeometry(3.1,1.8,4),mat(0x98472e));
 roof.position.y=3;roof.rotation.y=Math.PI/4;g.add(roof);
 cube(g,0,.7,1.78,.9,1.4,.12,wood);scene.add(g);
}
house(-9,-5,0xe6c58a);house(9,-7,0xd5a36b);
house(10,8,0xe0d19b);house(-12,9,0xd4b783);

/* ================= KAWASAN ================= */
for(let i=0;i<8;i++){
 const r=new THREE.Mesh(new THREE.ConeGeometry(7+Math.random()*5,15+Math.random()*10,7),stone);
 r.position.set(48+(Math.random()-.5)*35,7,-48+(Math.random()-.5)*35);
 scene.add(r);
}
const lava=new THREE.Mesh(new THREE.CircleGeometry(5,24),mat(0xff541c));
lava.rotation.x=-Math.PI/2;lava.position.set(52,9,-39);scene.add(lava);

const river=new THREE.Mesh(new THREE.PlaneGeometry(12,70),water);
river.rotation.x=-Math.PI/2;river.position.set(-65,.02,34);scene.add(river);
const waterfall=new THREE.Mesh(new THREE.PlaneGeometry(12,13),
 new THREE.MeshStandardMaterial({color:0x69dfff,transparent:true,opacity:.8}));
waterfall.position.set(-65,6,-1);scene.add(waterfall);
cube(scene,-65,12,-1,14,1,5,stone);
for(let i=0;i<7;i++)cube(scene,-65,.5,5+i*2,13,.5,1.7,wood);

for(let i=0;i<7;i++){
 const ice=new THREE.Mesh(new THREE.ConeGeometry(1.2,4+Math.random()*4,5),mat(0xa9e7f4));
 ice.position.set(40+Math.random()*30,2,35+Math.random()*25);scene.add(ice);
}
const caveRock=new THREE.Mesh(new THREE.ConeGeometry(11,14,7),stone);
caveRock.position.set(-88,5,-50);scene.add(caveRock);
const caveHole=new THREE.Mesh(new THREE.CircleGeometry(4,24),mat(0x10171d));
caveHole.position.set(-88,2,-39);scene.add(caveHole);

/* ================= WIRA ================= */
const colors=[0x65c94d,0x4a9aab,0xd9a82e,0x368dd0];
const names=['LALA','TORA','RAJA REX','BOBI'];
const words=[
 'Jom kita bantu kawan! Kawan yang susah jangan kita tinggalkan.',
 'Jangan putus asa! Cuba lagi. Kita pasti boleh!',
 'Pemimpin yang baik mendengar pendapat kawan-kawan!',
 'Sungai bersih, kampung ceria! Mari kita jaga alam bersama-sama!'
];

function makeDino(color,kind=0,size=.7){
 const root=new THREE.Group(),body=new THREE.Group();
 root.add(body);
 const skin=mat(color),belly=mat(0xe8d7a4);
 ball(body,0,1.05,0,1.05,.72,1.35,skin);
 ball(body,0,.72,.72,.72,.42,.75,belly);
 ball(body,0,1.75,1.05,.68,.62,.65,skin);
 ball(body,-.27,1.85,1.59,.13,.15,.1,white);
 ball(body,.27,1.85,1.59,.13,.15,.1,white);
 ball(body,-.27,1.85,1.68,.06,.08,.04,black);
 ball(body,.27,1.85,1.68,.06,.08,.04,black);
 ball(body,0,.95,-1.55,.28,.3,.95,skin);
 const legs=[];
 for(const x of [-.55,.55])for(const z of [-.65,.65])
  legs.push(cyl(body,x,.42,z,.22,.28,.75,skin));
 if(kind===1){
  for(let i=-1;i<=1;i++)ball(body,i*.42,2.25,.8,.24,.8,.24,white);
  ball(body,0,1.8,1.7,.85,.18,.25,white);
 }
 if(kind===2){
  cyl(body,0,2.5,1.05,.08,.08,.6,gold);
  ball(body,0,2.85,1.05,.3,.2,.3,gold);
 }
 if(kind===3)ball(body,0,1.4,1.55,.28,.18,.2,mat(0x6fc9e9));
 root.scale.setScalar(size);
 root.userData={body,legs};
 return root;
}
let selected=0;
const player=makeDino(colors[0],0,.72);
scene.add(player);player.position.set(0,0,15);
let followers=[];
function followersSetup(){
 followers.forEach(f=>scene.remove(f));followers=[];
 for(let i=1;i<4;i++){
  const n=(selected+i)%4;
  const f=makeDino(colors[n],n,.5);
  scene.add(f);followers.push(f);
 }
}
followersSetup();
function chooseHero(i){
 selected=i;
 const fresh=makeDino(colors[i],i,.72);
 while(player.children.length)player.remove(player.children[0]);
 while(fresh.children.length)player.add(fresh.children[0]);
 player.userData=fresh.userData;
 followersSetup();
 document.querySelectorAll('.hero').forEach((b,j)=>b.classList.toggle('active',j===i));
 document.getElementById('heroName').textContent=names[i];
}
document.querySelectorAll('.hero').forEach(b=>b.onclick=()=>chooseHero(+b.dataset.hero));

/* ================= WATAK ================= */
function npc(x,z,color,name){
 const n=makeDino(color,0,.68);n.position.set(x,0,z);
 n.userData.name=name;scene.add(n);return n;
}
const chief=npc(2,0,0xf1a65b,'Ketua Kampung');
const keeper=npc(-65,15,0x9cdb75,'Penjaga Sungai');
const babies=[
 npc(-42,-23,0xf2a6d0,'Anak Dinosaur'),
 npc(-55,-35,0xffd16c,'Anak Dinosaur'),
 npc(-35,-42,0x9ddaf0,'Anak Dinosaur')
];
const babySaved=[false,false,false];

const wild=[];
for(let i=0;i<5;i++){
 const d=makeDino([0x8eaa52,0xb58a5e,0x7799a8][i%3],i%2,.62);
 d.position.set(-35+Math.random()*70,0,-55+Math.random()*90);
 d.userData.origin=d.position.clone();
 d.userData.phase=Math.random()*6;
 scene.add(d);wild.push(d);
}

/* ================= OBJEK MISI ================= */
const crystals=[],eggs=[];
for(let i=0;i<8;i++){
 const c=new THREE.Mesh(new THREE.OctahedronGeometry(.8),gold);
 c.position.set(-85+Math.random()*125,1,-70+Math.random()*125);
 c.userData.taken=false;scene.add(c);crystals.push(c);
}
for(let i=0;i<3;i++){
 const e=new THREE.Mesh(new THREE.SphereGeometry(.65,12,9),mat(0xffe8bd));
 e.scale.set(.8,1.25,.8);
 e.position.set(-40-i*8,1,-20-i*7);
 e.userData.taken=false;scene.add(e);eggs.push(e);
}

/* ================= RAJA BAYANG ================= */
const boss=makeDino(0x342b42,2,1.65);
boss.position.set(75,0,-70);
scene.add(boss);
boss.visible=false;
const bossAura=new THREE.Mesh(
 new THREE.TorusGeometry(2.6,.18,8,28),
 new THREE.MeshStandardMaterial({color:0xb45bff,emissive:0x551188})
);
bossAura.rotation.x=Math.PI/2;
bossAura.position.set(75,.25,-70);
scene.add(bossAura);bossAura.visible=false;

let bossHealth=100,bossActive=false,bossDefeated=false;
let attackReady=true;
let lastBossHit=0;

/* ================= STATUS DAN MISI ================= */
let health=5,crystalCount=0,eggCount=0,rescueCount=0;
let mission=0;
const missionText=[
 'Cari ketua kampung di kawasan rumah.',
 'Selamatkan tiga anak dinosaur di hutan.',
 'Kumpulkan tiga telur dinosaur.',
 'Cari lapan kristal ajaib.',
 'Pergi ke air terjun dan jumpa penjaga sungai.',
 'Terokai gunung berapi dan lembah ais.',
 'Pergi ke istana Raja Bayang!',
 'Kalahkan Raja Bayang!',
 'Tahniah! Kerajaan dinosaur telah diselamatkan!'
];
function updateUI(){
 document.getElementById('mission').textContent='Misi: '+missionText[mission];
 document.getElementById('health').textContent=health;
 document.getElementById('crystals').textContent=crystalCount;
 document.getElementById('eggs').textContent=eggCount;
 document.getElementById('rescued').textContent=rescueCount;
 document.getElementById('healthfill').style.width=(health/5*100)+'%';
 document.getElementById('bossfill').style.width=bossHealth+'%';
 document.getElementById('bossHealthText').textContent='Tenaga: '+bossHealth+'%';
}
updateUI();

/* ================= DIALOG DAN SUARA ================= */
let voiceOn=true;
function say(t){
 document.getElementById('dialogText').textContent=t;
 document.getElementById('dialog').style.display='block';
 if(voiceOn&&'speechSynthesis'in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang='ms-MY';u.rate=.88;speechSynthesis.speak(u);
 }
}
document.getElementById('closeDialog').onclick=()=>{
 document.getElementById('dialog').style.display='none';
};
document.getElementById('sound').onclick=()=>{
 voiceOn=!voiceOn;
 document.getElementById('sound').textContent=voiceOn?'🔊':'🔇';
 if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();
};

/* ================= KAWALAN ================= */
const keys={};
document.querySelectorAll('[data-move]').forEach(b=>{
 const k=b.dataset.move;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>
  b.addEventListener(ev,()=>keys[k]=false));
});
addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')keys.forward=true;
 if(e.key==='ArrowDown'||e.key==='s')keys.back=true;
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
 if(e.key===' ')jump();
 if(e.key==='e')interact();
});
addEventListener('keyup',e=>{
 if(['ArrowUp','w'].includes(e.key))keys.forward=false;
 if(['ArrowDown','s'].includes(e.key))keys.back=false;
 if(['ArrowLeft','a'].includes(e.key))keys.left=false;
 if(['ArrowRight','d'].includes(e.key))keys.right=false;
});

let jumping=false,jumpVelocity=0;
function jump(){if(!jumping){jumping=true;jumpVelocity=8}}
document.getElementById('jump').onclick=jump;

let shieldUntil=0,powerReady=true;
const clock=new THREE.Clock();
document.getElementById('power').onclick=()=>{
 if(!powerReady)return;
 powerReady=false;
 shieldUntil=clock.elapsedTime+5;
 say([
  'LALA menggunakan kuasa penyayang! Cahaya ajaib membantu semua kawan.',
  'TORA mengaktifkan perisai berani! Jangan takut menghadapi cabaran.',
  'RAJA REX memberi semangat kepada pasukan. Kita bekerjasama!',
  'BOBI memanggil kuasa alam! Kita jaga bumi bersama-sama!'
 ][selected]);
 setTimeout(()=>powerReady=true,5000);
};

/* ================= INTERAKSI ================= */
function distance(a,b){return a.position.distanceTo(b.position)}
function interact(){
 if(distance(player,chief)<6){
  say('Selamat datang, wira! Raja Bayang mengganggu kerajaan kita. Bantu kawan-kawan, kumpulkan kristal dan selamatkan kerajaan!');
  if(mission===0)mission=1;
 }else if(distance(player,keeper)<6){
  say('Terima kasih kerana datang! Sungai bersih penting untuk semua makhluk. Kamu wira yang prihatin!');
  if(mission===4)mission=5;
 }else{
  let found=-1;
  for(let i=0;i<3;i++){
   if(!babySaved[i]&&distance(player,babies[i])<5){found=i;break}
  }
  if(found>=0){
   babySaved[found]=true;babies[found].visible=false;
   rescueCount++;
   say('Syabas! Kamu menyelamatkan seorang anak dinosaur. Teruskan membantu kawan-kawan!');
   if(rescueCount===3&&mission===1){
    mission=2;
    say('Semua anak dinosaur selamat! Sekarang cari telur dinosaur pula.');
   }
  }else if(distance(player,boss)<8&&bossActive&&!bossDefeated){
   say('Raja Bayang: Kamu tidak akan dapat mengalahkan aku!');
  }else{
   say(words[selected]);
  }
 }
 updateUI();
}
document.getElementById('talk').onclick=interact;

/* ================= SERANGAN WIRA ================= */
document.getElementById('attack').onclick=()=>{
 if(!attackReady)return;
 attackReady=false;
 setTimeout(()=>attackReady=true,650);
 if(bossActive&&!bossDefeated&&distance(player,boss)<15){
  bossHealth=Math.max(0,bossHealth-12);
  updateUI();
  say('Serangan wira berjaya! Teruskan sehingga tenaga Raja Bayang habis!');
  if(bossHealth===0){
   bossDefeated=true;boss.visible=false;bossAura.visible=false;
   mission=8;updateUI();
   say('Kamu berjaya! Raja Bayang telah dikalahkan. Kerajaan dinosaur kembali aman. Tahniah, wira!');
  }
 }else{
  say('Ayunkan kuasa wira! Dekati musuh untuk menyerang Raja Bayang.');
 }
};

/* ================= ZON ================= */
function zoneName(){
 const x=player.position.x,z=player.position.z;
 if(bossActive&&x>55&&z<-45)return 'ISTANA RAJA BAYANG';
 if(x<-75&&z<-30)return 'GUA RAHSIA';
 if(x<-25&&z<-5)return 'HUTAN AJAIB';
 if(x<-45&&z>5&&z<65)return 'SUNGAI & AIR TERJUN';
 if(x>28&&z<-10)return 'GUNUNG BERAPI';
 if(x>28&&z>15)return 'LEMBAH AIS';
 return 'KAMPUNG DINOSAUR';
}

/* ================= PERMAINAN ================= */
let lastHit=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;
 const moving=keys.forward||keys.back||keys.left||keys.right;
 const speed=10;
 let direction=player.rotation.y;

 if(keys.forward){player.position.z-=speed*dt;direction=Math.PI}
 if(keys.back){player.position.z+=speed*dt;direction=0}
 if(keys.left){player.position.x-=speed*dt;direction=-Math.PI/2}
 if(keys.right){player.position.x+=speed*dt;direction=Math.PI/2}
 if(moving)player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,direction,.17);

 player.position.x=THREE.MathUtils.clamp(player.position.x,-120,120);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-120,120);

 if(jumping){
  player.position.y+=jumpVelocity*dt;
  jumpVelocity-=20*dt;
  if(player.position.y<=0){player.position.y=0;jumping=false}
 }
 const pu=player.userData;
 if(pu.body){
  const bob=moving?Math.abs(Math.sin(t*12))*.09:Math.sin(t*2)*.025;
  pu.body.position.y+=(bob-pu.body.position.y)*.2;
  pu.legs.forEach((l,i)=>l.rotation.x=moving?Math.sin(t*12+i*Math.PI)*.5:0);
 }

 // Pengikut
 followers.forEach((f,i)=>{
  const target=new THREE.Vector3(
   player.position.x+Math.sin(player.rotation.y+(i+1)*2)*3,0,
   player.position.z+Math.cos(player.rotation.y+(i+1)*2)*3
  );
  f.position.lerp(target,.05);
  f.rotation.y=player.rotation.y;
  if(f.userData.body)f.userData.body.position.y=Math.sin(t*3+i)*.035;
  if(f.userData.legs)f.userData.legs.forEach((l,j)=>l.rotation.x=Math.sin(t*5+j+i)*.15);
 });

 // Dinosaur liar
 wild.forEach((d,i)=>{
  const dist=distance(d,player);
  if(dist<12){
   const dx=player.position.x-d.position.x;
   const dz=player.position.z-d.position.z;
   d.position.x+=dx*.18*dt;
   d.position.z+=dz*.18*dt;
  }else{
   d.userData.phase+=dt*.45;
   d.position.x=d.userData.origin.x+Math.sin(d.userData.phase)*5;
   d.position.z=d.userData.origin.z+Math.cos(d.userData.phase)*5;
  }
  d.rotation.y=Math.atan2(player.position.x-d.position.x,player.position.z-d.position.z);
  if(d.userData.body)d.userData.body.position.y=Math.abs(Math.sin(t*4+i))*.04;
  if(dist<2.5&&t-lastHit>2.5&&t>shieldUntil){
   health=Math.max(0,health-1);lastHit=t;updateUI();
   say('Awas! Dinosaur liar menghampiri. Bergerak menjauh atau gunakan kuasa wira!');
   if(health===0){
    health=5;player.position.set(0,0,15);updateUI();
    say('Jangan putus asa! Kamu kembali ke kampung. Cuba lagi!');
   }
  }
 });

 // Kutip kristal
 crystals.forEach(c=>{
  if(c.userData.taken)return;
  c.rotation.y+=dt;c.position.y=1+Math.sin(t*2+c.position.x)*.2;
  if(distance(player,c)<2.3){
   c.userData.taken=true;c.visible=false;crystalCount++;
   updateUI();
   say('Bagus! Kamu mendapat kristal ajaib!');
   if(crystalCount===8&&mission===3)mission=4;
  }
 });
 // Kutip telur
 eggs.forEach(e=>{
  if(e.userData.taken)return;
  e.rotation.y+=dt;
  if(distance(player,e)<2.5){
   e.userData.taken=true;e.visible=false;eggCount++;
   updateUI();
   say('Kamu menjumpai telur dinosaur. Jagalah dengan baik!');
   if(eggCount===3&&mission===2)mission=3;
  }
 });

 // Animasi air
 waterfall.position.y=6+Math.sin(t*3)*.18;
 river.material.opacity=.72+Math.sin(t*2)*.08;

 // Perjalanan misi
 const x=player.position.x,z=player.position.z;
 if(mission===5&&x>35&&z<-15){
  mission=6;updateUI();
  say('Kamu telah meneroka kawasan gunung berapi! Sekarang menuju ke istana Raja Bayang di hujung timur laut.');
 }
 if(mission===6&&x>65&&z<-55){
  mission=7;bossActive=true;boss.visible=true;bossAura.visible=true;
  document.getElementById('bossPanel').style.display='block';
  updateUI();
  say('Awas! Raja Bayang muncul! Dekati musuh dan tekan SERANG untuk menewaskannya!');
 }

 // Ketua musuh
 if(bossActive&&!bossDefeated){
  boss.position.y=Math.sin(t*2)*.15;
  bossAura.position.x=boss.position.x;
  bossAura.position.z=boss.position.z;
  bossAura.rotation.z+=dt;
  const d=distance(player,boss);
  if(d<11){
   const dx=player.position.x-boss.position.x;
   const dz=player.position.z-boss.position.z;
   boss.position.x-=dx*.12*dt;
   boss.position.z-=dz*.12*dt;
   if(t-lastBossHit>3&&t>shieldUntil){
    health=Math.max(0,health-1);
    lastBossHit=t;updateUI();
    say('Raja Bayang menyerang! Gunakan serangan wira dan elakkan musuh!');
    if(health===0){
     health=5;player.position.set(0,0,15);updateUI();
     say('Kamu kembali ke kampung untuk berehat. Jangan mengalah!');
    }
   }
  }
 }
 document.getElementById('zone').textContent=zoneName();

 const camTarget=new THREE.Vector3(
  player.position.x+Math.sin(player.rotation.y)*1,
  player.position.y+9,
  player.position.z+14
 );
 camera.position.lerp(camTarget,.075);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
