
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jurassic World Explorer V8</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101c20;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.panel{background:#102b27dc;color:white;padding:9px 12px;border:1px solid #ffffff40;border-radius:12px;font-size:12px;max-width:72%}
#zone{font-size:15px;font-weight:bold;color:#ffe58a}
#mission{margin-top:4px}
#characters{position:fixed;top:75px;left:8px;display:flex;gap:5px;flex-direction:column}
.hero{background:#172c2bdc;color:white;border:1px solid #ffffff55;border-radius:10px;padding:8px;font-size:12px}
.hero.active{border:2px solid #ffe36a;background:#52652dcc}
#bottom{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}
#moves,#actions{display:flex;gap:7px;pointer-events:auto}
button{border:1px solid #ffffff66;background:#183b35df;color:white;border-radius:14px;font-weight:bold;min-width:48px;height:48px;font-size:17px;touch-action:none}
button:active{background:#b18a35}
#actions{flex-direction:column}
#actions button{font-size:12px;padding:0 10px}
#message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#142d27f2;color:white;border:2px solid #f6d46a;border-radius:16px;padding:18px;width:min(85%,360px);text-align:center;display:none;z-index:5}
#message button{margin-top:12px;height:40px}
#hint{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);color:white;background:#142d27bb;padding:7px 12px;border-radius:12px;font-size:11px;white-space:nowrap}
#sound{position:fixed;right:10px;top:60px;height:35px;min-width:40px;font-size:12px}
@media(min-width:800px){#bottom{max-width:700px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>
<div id="top">
 <div class="panel"><div id="zone">KAMPUNG DINOSAUR</div><div id="mission">Misi: Cari ketua kampung.</div></div>
 <div class="panel">Kristal: <span id="score">0</span> / 8<br>Wira: <span id="heroName">LALA</span></div>
</div>
<div id="characters">
 <button class="hero active" data-hero="0">🟢 LALA</button>
 <button class="hero" data-hero="1">🛡️ TORA</button>
 <button class="hero" data-hero="2">👑 RAJA REX</button>
 <button class="hero" data-hero="3">🔵 BOBI</button>
</div>
<button id="sound">🔊</button>
<div id="hint">Gerakkan wira • Dekati watak untuk berinteraksi</div>
<div id="bottom">
 <div id="moves">
  <button data-move="left">◀</button>
  <button data-move="forward">▲</button>
  <button data-move="back">▼</button>
  <button data-move="right">▶</button>
 </div>
 <div id="actions">
  <button id="jump">LOMPAT</button>
  <button id="power">KUASA</button>
  <button id="talk">BERCAKAP</button>
 </div>
</div>
<div id="message"><div id="msgText"></div><button id="closeMsg">SAMBUNG</button></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ed4e5);
scene.fog=new THREE.Fog(0x8ed4e5,100,230);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);
camera.position.set(0,10,16);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff5ff,0x52633c,2));
const sun=new THREE.DirectionalLight(0xffffff,2.1);
sun.position.set(-50,90,40);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(c,rough=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
const green=mat(0x64b94e),darkGreen=mat(0x286c3c),brown=mat(0x79502e),
      wood=mat(0x9b6537),stone=mat(0x777b78),gold=mat(0xffc83d),
      water= new THREE.MeshStandardMaterial({color:0x36bde1,transparent:true,opacity:.78,roughness:.2}),
      leaf=mat(0x2e8545),white=mat(0xffffff),black=mat(0x172027);

function box(parent,x,y,z,sx,sy,sz,m){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;
}
function sphere(parent,x,y,z,sx,sy,sz,m){
 const o=new THREE.Mesh(new THREE.SphereGeometry(1,12,9),m);
 o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;parent.add(o);return o;
}
function cylinder(parent,x,y,z,r1,r2,h,m){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,9),m);
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}
function ground(x,z,w,d,color){
 const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(color));
 o.rotation.x=-Math.PI/2;o.position.set(x,-.08,z);o.receiveShadow=true;scene.add(o);return o;
}

// Dunia utama
ground(0,0,260,260,0x78b85a);
ground(0,0,48,38,0x91c86b);                 // kampung
ground(-48,-28,55,55,0x397c43);              // hutan
ground(-65,35,55,48,0x8bba79);              // sungai
ground(52,-38,55,55,0x9c6043);              // gunung berapi
ground(55,45,55,50,0xc9e6ee);                // lembah ais

// Laluan
ground(0,0,5,95,0xb6a078);
ground(-25,-20,50,4,0xb6a078);
ground(-50,8,4,60,0xb6a078);
ground(25,-20,55,4,0xb6a078);
ground(48,10,4,55,0xb6a078);

// Pokok
function tree(x,z,s=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
 cylinder(g,0,1.1,0,.25,.35,2.2,brown);
 sphere(g,0,2.4,0,1.15,1.4,1.1,leaf);
 sphere(g,-.55,2.1,.1,.8,.9,.8,darkGreen);
 sphere(g,.55,2.1,-.1,.8,.9,.8,green);
 scene.add(g);
}
for(let i=0;i<38;i++){
 const a=Math.random()*Math.PI*2,r=28+Math.random()*30;
 tree(-48+Math.cos(a)*r,-28+Math.sin(a)*r,.7+Math.random()*.6);
}
for(let i=0;i<22;i++)tree(52+(Math.random()-.5)*48, -38+(Math.random()-.5)*48,.7+Math.random()*.6);
for(let i=0;i<12;i++)tree((Math.random()-.5)*38,(Math.random()-.5)*30,.7+Math.random()*.5);

// Rumah kampung
function house(x,z,color){
 const g=new THREE.Group();g.position.set(x,0,z);
 box(g,0,1.1,0,4,2.2,3.5,mat(color));
 const roof=new THREE.Mesh(new THREE.ConeGeometry(3.1,1.8,4),mat(0x9b4931));
 roof.position.y=3;roof.rotation.y=Math.PI/4;g.add(roof);
 box(g,0,.7,1.78,.9,1.4,.12,wood);
 scene.add(g);
}
house(-9,-5,0xe6c58a);house(9,-7,0xd3a46a);house(10,8,0xe0d19b);
house(-12,9,0xd4b783);

// Gunung dan kawah
for(let i=0;i<7;i++){
 const rock=new THREE.Mesh(new THREE.ConeGeometry(7+Math.random()*5,15+Math.random()*10,7),mat(0x69534a));
 rock.position.set(48+(Math.random()-.5)*35,7,-48+(Math.random()-.5)*35);
 rock.rotation.z=(Math.random()-.5)*.2;scene.add(rock);
}
const lava=new THREE.Mesh(new THREE.CircleGeometry(5,24),mat(0xff5a1f));
lava.rotation.x=-Math.PI/2;lava.position.set(52,9,-39);scene.add(lava);

// Sungai dan air terjun
const river=new THREE.Mesh(new THREE.PlaneGeometry(12,70),water);
river.rotation.x=-Math.PI/2;river.position.set(-65,.03,34);scene.add(river);
const falls=new THREE.Mesh(new THREE.PlaneGeometry(12,13),water);
falls.position.set(-65,6,-1);scene.add(falls);
box(scene,-65,12,-1,14,1,5,stone);
for(let i=0;i<5;i++){
 const splash=sphere(scene,-70+i*2.4,.4,-1,.6,.25,.6,white);
 splash.userData.splash=true;
}

// Jambatan
for(let i=0;i<7;i++){
 box(scene,-65,.5,5+i*2,13,.5,1.7,wood);
}
for(const x of [-71,-59]){
 box(scene,x,1.1,11,.25,1.3,wood);
}

// Gua rahsia
const caveRock=new THREE.Mesh(new THREE.ConeGeometry(11,14,7),stone);
caveRock.position.set(-88,5,-50);scene.add(caveRock);
const cave=new THREE.Mesh(new THREE.CircleGeometry(4,24),mat(0x10171d));
cave.position.set(-88,2,-39);scene.add(cave);
for(let i=0;i<5;i++){
 const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.8),gold);
 crystal.position.set(-91+i*1.5,1.5+(i%2),-42);
 scene.add(crystal);
}

// Ais dan kristal
for(let i=0;i<16;i++){
 const ice=new THREE.Mesh(new THREE.ConeGeometry(1.2,4+Math.random()*4,5),mat(0xa9e7f4,.35));
 ice.position.set(40+Math.random()*30,2,35+Math.random()*25);scene.add(ice);
}

// Model dinosaur
const heroColors=[0x65c94d,0x4a9aab,0xd9a82e,0x368dd0];
const heroNames=['LALA','TORA','RAJA REX','BOBI'];
const heroLines=[
 'Jom kita bantu kawan! Kawan yang susah jangan kita tinggalkan.',
 'Jangan putus asa! Cuba lagi. Kita pasti boleh!',
 'Pemimpin yang baik mendengar pendapat kawan-kawan!',
 'Sungai bersih, kampung ceria! Mari kita jaga alam bersama-sama!'
];
function makeDino(color,kind=0,scale=1){
 const root=new THREE.Group();
 const body=new THREE.Group();root.add(body);
 const skin=mat(color),belly=mat(0xe9d7a2),eye=white;
 sphere(body,0,1.05,0,1.05,.72,1.35,skin);
 sphere(body,0,.72,.72,.72,.42,.75,belly);
 sphere(body,0,1.75,1.05,.68,.62,.65,skin);
 sphere(body,-.27,1.85,1.59,.13,.15,.1,eye);
 sphere(body,.27,1.85,1.59,.13,.15,.1,eye);
 sphere(body,-.27,1.85,1.68,.06,.08,.04,black);
 sphere(body,.27,1.85,1.68,.06,.08,.04,black);
 const tail=sphere(body,0,.95,-1.55,.28,.3,.95,skin);
 tail.rotation.x=-.25;
 const legs=[];
 for(const x of [-.55,.55]){
  for(const z of [-.65,.65]){
   const leg=cylinder(body,x,.42,z,.22,.28,.75,skin);
   legs.push(leg);
  }
 }
 if(kind===1){
  for(let i=-1;i<=1;i++)sphere(body,i*.42,2.25,.8,.24,.8,.24,mat(0xe5e5e5));
  sphere(body,0,1.8,1.7,.85,.18,.25,mat(0xe4e4e4));
 }
 if(kind===2){
  cylinder(body,0,2.5,1.05,.08,.08,.6,gold);
  sphere(body,0,2.85,1.05,.3,.2,.3,gold);
 }
 if(kind===3){
  sphere(body,0,1.4,1.55,.28,.18,.2,mat(0x6fc9e9));
 }
 root.add(body);root.scale.setScalar(scale);
 root.userData={body,legs,phase:Math.random()*5};
 return root;
}

let selected=0;
const player=makeDino(heroColors[0],0,.72);
scene.add(player);
player.position.set(0,0,15);
let followers=[];
function setFollowers(){
 followers.forEach(f=>scene.remove(f));
 followers=[];
 for(let i=0;i<3;i++){
  const idx=(selected+i+1)%4;
  const f=makeDino(heroColors[idx],idx,.52);
  scene.add(f);followers.push(f);
 }
}
setFollowers();

function switchHero(i){
 selected=i;
 scene.remove(player);
 const fresh=makeDino(heroColors[i],i,.72);
 player.children.length=0;
 while(fresh.children.length)player.add(fresh.children[0]);
 player.userData=fresh.userData;
 setFollowers();
 document.querySelectorAll('.hero').forEach((b,j)=>b.classList.toggle('active',j===i));
 document.getElementById('heroName').textContent=heroNames[i];
}
document.querySelectorAll('.hero').forEach(b=>b.addEventListener('click',()=>switchHero(+b.dataset.hero)));

// NPC
function makeNPC(x,z,color,name){
 const n=makeDino(color,0,.7);n.position.set(x,0,z);scene.add(n);
 n.userData.npcName=name;return n;
}
const chief=makeNPC(2,0,0xf1a65b,'Ketua Kampung');
const friend=makeNPC(-48,-28,0xe6a5e8,'Dino kecil');
const ranger=makeNPC(-65,15,0x9cdb75,'Penjaga sungai');

// Dinosaur liar
const wild=[];
for(let i=0;i<5;i++){
 const d=makeDino([0x8eaa52,0xb58a5e,0x7799a8][i%3],i%2,.65);
 d.position.set(-35+Math.random()*70,0,-55+Math.random()*90);
 d.userData={...d.userData,roam:Math.random()*6,origin:d.position.clone()};
 scene.add(d);wild.push(d);
}

// Kristal
const crystals=[];
for(let i=0;i<8;i++){
 const c=new THREE.Mesh(new THREE.OctahedronGeometry(.8),gold);
 c.position.set(-85+Math.random()*125,1,-70+Math.random()*125);
 c.userData.collected=false;scene.add(c);crystals.push(c);
}
let score=0;
const missions=[
 'Cari ketua kampung di kawasan rumah.',
 'Bantu dinosaur kecil di Hutan Ajaib.',
 'Pergi ke gua rahsia dan cari kristal.',
 'Lintas jambatan dan lawat air terjun.',
 'Terokai Gunung Berapi.',
 'Akhir sekali, lawat Lembah Ais!'
];
let mission=0;
function updateMission(){document.getElementById('mission').textContent='Misi: '+missions[mission];}
updateMission();

// Dialog dan suara
let voiceOn=true;
function say(text){
 document.getElementById('msgText').textContent=text;
 document.getElementById('message').style.display='block';
 if(voiceOn && 'speechSynthesis' in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ms-MY';u.rate=.88;speechSynthesis.speak(u);
 }
}
document.getElementById('closeMsg').onclick=()=>document.getElementById('message').style.display='none';
document.getElementById('sound').onclick=()=>{
 voiceOn=!voiceOn;document.getElementById('sound').textContent=voiceOn?'🔊':'🔇';
 if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();
};

// Kawalan
const keys={};
document.querySelectorAll('[data-move]').forEach(b=>{
 const k=b.dataset.move;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});
addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')keys.forward=true;
 if(e.key==='ArrowDown'||e.key==='s')keys.back=true;
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
 if(e.key===' ')jump();
 if(e.key==='e')interact();
});
addEventListener('keyup',e=>{
 if(['ArrowUp','w'].includes(e.key))keys.forward=false;
 if(['ArrowDown','s'].includes(e.key))keys.back=false;
 if(['ArrowLeft','a'].includes(e.key))keys.left=false;
 if(['ArrowRight','d'].includes(e.key))keys.right=false;
});

let jumping=false,jumpV=0;
function jump(){if(!jumping){jumping=true;jumpV=8}}
document.getElementById('jump').onclick=jump;

let powerReady=true;
document.getElementById('power').onclick=()=>{
 if(!powerReady)return;
 powerReady=false;
 const words=[
  'Kuasa penyayang! LALA menyebarkan cahaya penyembuh. Mari bantu semua kawan!',
  'Kuasa berani! TORA membina perisai. Jangan takut untuk mencuba!',
  'Kuasa pemimpin! RAJA REX memberi semangat kepada semua. Kita bekerjasama!',
  'Kuasa alam! BOBI memulihkan alam sekitar. Jom jaga bumi kita!'
 ];
 say(words[selected]);
 setTimeout(()=>powerReady=true,5000);
};
document.getElementById('talk').onclick=()=>interact();

function distance(a,b){return a.position.distanceTo(b.position)}
function interact(){
 let near=null,best=6;
 for(const n of [chief,friend,ranger]){
  const d=distance(player,n);
  if(d<best){best=d;near=n}
 }
 if(near===chief){
  say('Selamat datang, wira! Kampung kita perlukan bantuan. Terokailah dunia ini dan kumpulkan kristal ajaib.');
  if(mission===0){mission=1;updateMission()}
 }else if(near===friend){
  say('Terima kasih kerana datang membantu! Kawan yang baik tidak meninggalkan kawannya.');
  if(mission===1){mission=2;updateMission()}
 }else if(near===ranger){
  say(heroLines[3]+' Air terjun itu sangat cantik!');
 }else{
  say(heroLines[selected]);
 }
}

function getZone(){
 const x=player.position.x,z=player.position.z;
 if(x<-75&&z<-30)return 'GUA RAHSIA';
 if(x<-25&&z<-5)return 'HUTAN AJAIB';
 if(x<-45&&z>5&&z<65)return 'SUNGAI & AIR TERJUN';
 if(x>28&&z<-10)return 'GUNUNG BERAPI';
 if(x>28&&z>15)return 'LEMBAH AIS';
 return 'KAMPUNG DINOSAUR';
}

// Animasi
const clock=new THREE.Clock();
let angle=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const moving=keys.forward||keys.back||keys.left||keys.right;
 const speed=10;
 if(keys.forward){player.position.z-=speed*dt;angle=Math.PI}
 if(keys.back){player.position.z+=speed*dt;angle=0}
 if(keys.left){player.position.x-=speed*dt;angle=-Math.PI/2}
 if(keys.right){player.position.x+=speed*dt;angle=Math.PI/2}
 if(moving)player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,angle,.15);

 player.position.x=THREE.MathUtils.clamp(player.position.x,-112,112);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-112,112);

 if(jumping){
  player.position.y+=jumpV*dt;jumpV-=20*dt;
  if(player.position.y<=0){player.position.y=0;jumping=false}
 }
 const pdata=player.userData;
 if(pdata.body){
  pdata.body.position.y+=( (moving?Math.abs(Math.sin(clock.elapsedTime*12))*.09:Math.sin(clock.elapsedTime*2)*.025)-pdata.body.position.y)*.2;
  pdata.legs.forEach((l,i)=>l.rotation.x=moving?Math.sin(clock.elapsedTime*12+i*Math.PI)*.5:0);
 }
 // Pengikut mengekori wira
 followers.forEach((f,i)=>{
  const target=new THREE.Vector3(
   player.position.x+Math.sin(player.rotation.y+(i+1)*2)*3,
   0,
   player.position.z+Math.cos(player.rotation.y+(i+1)*2)*3
  );
  f.position.lerp(target,.045);
  f.rotation.y=player.rotation.y;
  const u=f.userData;
  if(u.body)u.body.position.y=Math.sin(clock.elapsedTime*3+i)*.035;
  if(u.legs)u.legs.forEach((l,j)=>l.rotation.x=Math.sin(clock.elapsedTime*5+j+i)*.15);
 });
 // Dinosaur liar berjalan sekitar kawasan
 wild.forEach((d,i)=>{
  d.userData.roam+=dt*.45;
  d.position.x=d.userData.origin.x+Math.sin(d.userData.roam)*5;
  d.position.z=d.userData.origin.z+Math.cos(d.userData.roam)*5;
  d.rotation.y=Math.atan2(Math.cos(d.userData.roam),-Math.sin(d.userData.roam));
  if(d.userData.body)d.userData.body.position.y=Math.abs(Math.sin(clock.elapsedTime*4+i))*.04;
 });
 // Kristal boleh dikutip
 crystals.forEach(c=>{
  if(c.userData.collected)return;
  c.rotation.y+=dt;
  c.position.y=1+Math.sin(clock.elapsedTime*2+c.position.x)*.2;
  if(distance(player,c)<2.3){
   c.userData.collected=true;c.visible=false;score++;
   document.getElementById('score').textContent=score;
   say('Bagus! Kamu berjaya mendapatkan kristal ajaib!');
  }
 });
 // Air terjun bergerak
 falls.position.y=6+Math.sin(clock.elapsedTime*3)*.18;
 river.material.opacity=.7+Math.sin(clock.elapsedTime*2)*.08;
 // Kamera ikut pemain
 const camTarget=new THREE.Vector3(
  player.position.x+Math.sin(player.rotation.y)*1,
  player.position.y+9,
  player.position.z+14
 );
 camera.position.lerp(camTarget,.07);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);
 document.getElementById('zone').textContent=getZone();

 // Kemajuan misi berdasarkan lokasi
 const x=player.position.x,z=player.position.z;
 if(mission===2&&x<-78&&z<-30){mission=3;updateMission();say('Kamu menemui gua rahsia! Hebat, wira!');}
 if(mission===3&&x<-55&&z>4){mission=4;updateMission();say('Kamu berjaya sampai ke air terjun!');}
 if(mission===4&&x>35&&z<-15){mission=5;updateMission();say('Gunung berapi telah diterokai!');}
 if(mission===5&&x>35&&z>20){mission=6;updateMission();say('Tahniah! Kamu sudah meneroka semua kawasan. Kamu wira Jurassic!');}
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
