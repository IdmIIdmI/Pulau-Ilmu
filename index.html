
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Magical Jurassic Kingdom V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;
display:flex;justify-content:space-between;z-index:3;
color:white;font-weight:bold}
.panel{background:#32175be8;padding:10px 13px;
border:2px solid #e5baff;border-radius:14px;font-size:13px}
#message{position:fixed;top:65px;left:50%;
transform:translateX(-50%);background:#fff1b9;
color:#542b7d;padding:9px 13px;border-radius:12px;
font-size:12px;font-weight:bold;z-index:3}
#controls{position:fixed;bottom:15px;left:12px;right:12px;
display:flex;justify-content:space-between;z-index:4}
.pad{display:grid;grid-template-columns:52px 52px 52px;gap:5px}
button{background:#ffffffd9;border:2px solid white;
color:#45236c;border-radius:15px;font-size:22px;
font-weight:bold;touch-action:none}
.pad button{height:52px}
#up{grid-column:2}#left{grid-column:1}
#down{grid-column:2}#right{grid-column:3}
#jump,#magic{width:65px;height:65px;border-radius:50%;
font-size:12px}
#jump{position:fixed;right:91px;bottom:25px;
background:#ffe18a;z-index:4}
#magic{background:#dcb3ff}
#win{display:none;position:fixed;inset:0;
background:#160b36df;z-index:8;
align-items:center;justify-content:center;text-align:center}
#win div{background:#fff0c8;padding:28px;
border-radius:24px;color:#49266b}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">🏰 MAGICAL KINGDOM</div>
 <div class="panel">💎 <span id="score">0</span>/10</div>
</div>

<div id="message">Cari kristal dan telur dinosaur!</div>

<div id="controls">
 <div class="pad">
  <button id="up">▲</button>
  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
 </div>
 <button id="magic">✨ SIHIR</button>
</div>
<button id="jump">LOMPAT</button>

<div id="win">
 <div>
  <div style="font-size:55px">👑</div>
  <h2>WIRA MAGIK!</h2>
  <p>Kau berjaya mengumpul semua kristal!</p>
  <button onclick="location.reload()">MAIN LAGI</button>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// =============================
// 1. DUNIA 3D
// =============================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bdcf5);
scene.fog=new THREE.Fog(0x8bdcf5,35,90);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,.1,200);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x625080,2));

const sun=new THREE.DirectionalLight(0xffe6b0,2.5);
sun.position.set(12,25,12);
sun.castShadow=true;
scene.add(sun);

// =============================
// 2. FUNGSI OBJEK
// =============================

const mat=c=>new THREE.MeshStandardMaterial({color:c});

function box(parent,x,y,z,w,h,d,c){
const o=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),mat(c));
o.position.set(x,y,z);
o.castShadow=true;
parent.add(o);
return o;
}

function ball(parent,x,y,z,r,c){
const o=new THREE.Mesh(
new THREE.SphereGeometry(r,16,12),mat(c));
o.position.set(x,y,z);
o.castShadow=true;
parent.add(o);
return o;
}

function cone(parent,x,y,z,r,h,c){
const o=new THREE.Mesh(
new THREE.ConeGeometry(r,h,8),mat(c));
o.position.set(x,y,z);
o.castShadow=true;
parent.add(o);
return o;
}

// =============================
// 3. PULAU
// =============================

box(scene,0,-.7,0,42,1.4,34,0x926a45);
box(scene,0,.02,0,41.5,.2,33.5,0x51aa52);
box(scene,0,-1.5,0,120,.1,120,0x168ec2);

// Sungai
box(scene,-8,.12,0,3,.04,28,0x39c9ec);

// Batu sungai
for(let z=-12;z<14;z+=2){
ball(scene,-6,.2,z,.4,0x92978d);
ball(scene,-10,.2,z,.4,0x92978d);
}

// =============================
// 4. ISTANA
// =============================

function tower(x,z){
box(scene,x,2,z,3,4,3,0xeac5e9);
cone(scene,x,5,z,2,2.5,0x71399c);
}

box(scene,10,2,-8,12,4,3,0xe7b8dc);
box(scene,10,4,-8,12,.3,3.5,0x68318d);
tower(5,-8);
tower(15,-8);
box(scene,10,1,-6.3,2,2,.15,0x593273);

// Menara kecil
tower(-13,-12);

// =============================
// 5. POKOK AJAIB
// =============================

function tree(x,z){
const t=box(scene,x,.9,z,.35,1.8,.35,0x79502e);
ball(scene,x,2.1,z,1.1,0x32a75b);
ball(scene,x-.6,2,z,.65,0x45c77b);
ball(scene,x+.6,2,z,.65,0x45c77b);
ball(scene,x,2.7,z,.12,0xffe77a);
}

for(let i=0;i<25;i++){
let x=Math.random()*34-17;
let z=Math.random()*26-13;
if(Math.abs(x)>7)tree(x,z);
}

// Cendawan
for(let i=0;i<8;i++){
let x=Math.random()*28-14;
let z=Math.random()*22-11;
box(scene,x,.7,z,.3,1.4,.3,0xf4d5b5);
ball(scene,x,1.5,z,.8,0xe96cad);
}

// =============================
// 6. WATAK DINOSAUR
// =============================

function makeDino(bodyColor,robeColor,withHat=true){

const d=new THREE.Group();

ball(d,0,.95,0,.72,bodyColor);
ball(d,0,1.75,.05,.65,bodyColor);

// Muncung
ball(d,0,1.5,.53,.38,bodyColor);

// Mata
ball(d,-.25,1.9,.57,.14,0xffffff);
ball(d,.25,1.9,.57,.14,0xffffff);
ball(d,-.25,1.9,.7,.065,0x222033);
ball(d,.25,1.9,.7,.065,0x222033);

// Lubang hidung
ball(d,-.13,1.55,.86,.055,0x25352a);
ball(d,.13,1.55,.86,.055,0x25352a);

// Jubah
const robe=new THREE.Mesh(
new THREE.CylinderGeometry(.4,.8,1.2,12),
mat(robeColor));
robe.position.y=.65;
d.add(robe);

// Ekor
const tail=cone(d,0,.7,-1,.35,1.5,bodyColor);
tail.rotation.x=-Math.PI/2;

// Kaki
const legs=[];
for(let x of [-.24,.24]){
const l=box(d,x,.15,0,.23,.55,.27,bodyColor);
legs.push(l);
}

// Topi
if(withHat){
ball(d,0,2.35,0,.58,robeColor);
cone(d,0,2.9,0,.65,1.2,robeColor);
ball(d,.25,2.65,.4,.12,0xffdf58);
}

// Tongkat sihir
if(withHat){
const staff=new THREE.Group();
d.add(staff);
staff.position.set(.85,1,.1);

box(staff,0,.5,0,.09,1.4,.09,0x80502c);
ball(staff,0,1.3,0,.24,0x54eaff);
ball(staff,0,1.3,0,.1,0xffffff);
}

return {group:d,legs,tail};
}

const hero=makeDino(0x65c77a,0x7739a5,true);
scene.add(hero.group);
hero.group.position.set(0,0,7);

// Triceratops kesatria
const knight=makeDino(0x83bd55,0x98632e,false);
scene.add(knight.group);
knight.group.position.set(6,0,5);

// Tanduk kesatria
cone(knight.group,-.48,1.9,.4,.14,.8,0xffedca);
cone(knight.group,.48,1.9,.4,.14,.8,0xffedca);

// Perisai
box(knight.group,1,1,.3,.2,1,.8,0xe6b53d);

// =============================
// 7. NAGA TERBANG
// =============================

const dragon=new THREE.Group();
scene.add(dragon);

ball(dragon,0,0,0,.55,0x9c54d6);
ball(dragon,0,.25,.5,.4,0xb77ce9);

// Kepala
ball(dragon,0,.4,.8,.38,0xb77ce9);
ball(dragon,-.15,.48,1.1,.08,0xffffff);
ball(dragon,.15,.48,1.1,.08,0xffffff);
ball(dragon,-.15,.48,1.17,.04,0x222222);
ball(dragon,.15,.48,1.17,.04,0x222222);

// Sayap
const wings=[];
for(let s of [-1,1]){
const w=new THREE.Mesh(
new THREE.BoxGeometry(1.3,.08,1),
mat(0xc68af0));
w.position.set(s*.8,.3,0);
dragon.add(w);
wings.push({mesh:w,side:s});
}

// Ekor naga
const dtail=cone(dragon,0,-.1,-.9,.22,.9,0x9c54d6);
dtail.rotation.x=Math.PI/2;

dragon.position.set(0,7,0);

// =============================
// 8. TELUR DINOSAUR
// =============================

const eggs=[];

for(let i=0;i<5;i++){
const egg=new THREE.Group();

const e=new THREE.Mesh(
new THREE.SphereGeometry(.38,16,12),
mat(0xf1d9a4));
e.scale.set(.8,1.2,.8);
egg.add(e);

for(let j=0;j<5;j++){
ball(egg,
(Math.random()-.5)*.35,
(Math.random()-.5)*.7,
.3,.045,0x7a55a9);
}

egg.position.set(
Math.random()*28-14,.5,
Math.random()*22-11);

scene.add(egg);
eggs.push(egg);
}

// =============================
// 9. KRISTAL
// =============================

const gems=[];

for(let i=0;i<10;i++){

const g=new THREE.Mesh(
new THREE.OctahedronGeometry(.45),
new THREE.MeshStandardMaterial({
color:0x55eaff,
emissive:0x168aca,
emissiveIntensity:2
}));

g.position.set(
Math.random()*28-14,1,
Math.random()*22-11);

scene.add(g);
gems.push(g);
}

// =============================
// 10. KESAN MAGIK
// =============================

const sparkles=[];

for(let i=0;i<65;i++){
const p=new THREE.Mesh(
new THREE.SphereGeometry(.07,6,6),
new THREE.MeshBasicMaterial({color:0xffe77b}));
p.position.set(
Math.random()*34-17,
Math.random()*8+1,
Math.random()*30-15);
scene.add(p);
sparkles.push(p);
}

// Bola sihir
const spells=[];

function castSpell(){
const s=new THREE.Mesh(
new THREE.SphereGeometry(.28,12,12),
new THREE.MeshBasicMaterial({color:0x7ef7ff}));
s.position.copy(hero.group.position);
s.position.y+=1.6;
scene.add(s);
spells.push({
mesh:s,
direction:new THREE.Vector3(
Math.sin(hero.group.rotation.y),0,
Math.cos(hero.group.rotation.y))
});
}

// =============================
// 11. KAWALAN
// =============================

const keys={};

function bind(id,key){
const b=document.getElementById(id);
b.addEventListener('pointerdown',e=>{
e.preventDefault();
keys[key]=true;
b.setPointerCapture(e.pointerId);
});
['pointerup','pointercancel','lostpointercapture']
.forEach(ev=>b.addEventListener(ev,()=>keys[key]=false));
}

bind('up','up');
bind('down','down');
bind('left','left');
bind('right','right');
bind('jump','jump');

addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);

document.getElementById('magic')
.addEventListener('pointerdown',castSpell);

// =============================
// 12. ANIMASI
// =============================

let time=0,vy=0,ground=true;
let score=0,eggCount=0;

function animate(){

requestAnimationFrame(animate);
time+=.025;

const p=hero.group;
let moving=false;
const speed=.13;

if(keys.up){p.position.z-=speed;moving=true;p.rotation.y=0}
if(keys.down){p.position.z+=speed;moving=true;p.rotation.y=Math.PI}
if(keys.left){p.position.x-=speed;moving=true;p.rotation.y=-Math.PI/2}
if(keys.right){p.position.x+=speed;moving=true;p.rotation.y=Math.PI/2}

p.position.x=THREE.MathUtils.clamp(p.position.x,-18,18);
p.position.z=THREE.MathUtils.clamp(p.position.z,-14,14);

// Animasi kaki
hero.legs.forEach((l,i)=>{
l.rotation.x=moving?
Math.sin(time*12+i*Math.PI)*.55:0;
});

// Ekor bergerak
hero.tail.rotation.z=Math.sin(time*3)*.15;

// Melompat
if(keys.jump&&ground){
vy=.23;
ground=false;
}
p.position.y+=vy;
vy-=.012;

if(p.position.y<=0){
p.position.y=0;
vy=0;
ground=true;
}

// Naga terbang mengelilingi pemain
dragon.position.x=p.position.x+Math.sin(time*.8)*4;
dragon.position.z=p.position.z-4+Math.cos(time*.8)*3;
dragon.position.y=6+Math.sin(time*3)*.7;
dragon.rotation.y=Math.sin(time)*.5;

wings.forEach(w=>{
w.mesh.rotation.z=
w.side*Math.sin(time*12)*.7;
});

// Kristal
gems.forEach(g=>{
if(!g.visible)return;
g.rotation.y+=.05;
g.position.y=1+Math.sin(time*3)*.15;

if(g.position.distanceTo(p.position)<1.3){
g.visible=false;
score++;
document.getElementById('score').textContent=score;
document.getElementById('message').textContent=
'✨ Kristal sakti berjaya dikutip!';

if(score>=10){
document.getElementById('win').style.display='flex';
}
}
});

// Telur
eggs.forEach(e=>{
if(!e.visible)return;
e.rotation.y+=.015;
if(e.position.distanceTo(p.position)<1.2){
e.visible=false;
eggCount++;
document.getElementById('message').textContent=
'🥚 Telur dinosaur ditemui! '+eggCount+'/5';
}
});

// Bola sihir bergerak
for(let i=spells.length-1;i>=0;i--){
const s=spells[i];
s.mesh.position.addScaledVector(s.direction,.35);
if(s.mesh.position.length()>70){
scene.remove(s.mesh);
spells.splice(i,1);
}
}

// Bintang terapung
sparkles.forEach((s,i)=>{
s.position.y+=Math.sin(time+i)*.006;
s.rotation.y+=.02;
});

// Kesatria mengangguk
knight.group.rotation.y=Math.sin(time)*.15;

// Kamera
const target=new THREE.Vector3(
p.position.x+8,p.position.y+9,p.position.z+12);

camera.position.lerp(target,.075);
camera.lookAt(p.position.x,p.position.y+1,p.position.z);

renderer.render(scene,camera);
}

animate();

// =============================
// 13. SAIZ SKRIN
// =============================

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
